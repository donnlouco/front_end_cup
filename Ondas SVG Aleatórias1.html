<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ondas SVG Aleatórias</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #050816;
      font-family: Arial, Helvetica, sans-serif;
    }

    .stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      min-height: 500px;
      overflow: hidden;
      background:
        radial-gradient(circle at center, rgba(255,255,255,0.03) 0, rgba(255,255,255,0.015) 22%, transparent 60%),
        linear-gradient(180deg, #0c1328 0%, #050816 100%);
    }

    .waves {
      position: absolute;
      inset: 0;
      z-index: 1;
      overflow: hidden;
      pointer-events: none;
    }

    .icon-stack {
      position: absolute;
      left: 50%;
      top: 0;
      width: 900px;
      height: 100vh;
      min-height: 500px;
      transform: translateX(-50%);
      z-index: 3;
      pointer-events: none;
    }

    .icon {
      position: absolute;
      left: 50%;
      width: 800px;
      height: 800px;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 0;
      transform: translateX(-50%);
    }

    #iconA {
      top: -120px;
    }

    #iconB {
      top: 80px;
    }

    .icon svg {
      width: 100%;
      height: 100%;
      overflow: visible;
      display: block;
    }

    .icon path {
      fill: rgba(255,255,255,0.96);
      stroke: none;
    }

    .center-logo {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 34%;
      height: 34%;
      object-fit: contain;
      transform: translate(-50%, -50%);
      z-index: 4;
      pointer-events: none;
    }

    .wave {
      position: absolute;
      pointer-events: none;
      overflow: visible;
      transform: translateY(0px);
      animation: drift 8s ease-in-out forwards;
    }

    .wave.upward {
      --driftY: 23px;
    }

    .wave.downward {
      --driftY: -23px;
    }

    @keyframes drift {
      0% { transform: translateY(0px); }
      100% { transform: translateY(var(--driftY)); }
    }

    .wave-grow {
      position: absolute;
      left: 0;
      width: 100%;
      height: 100%;
      will-change: transform;
      transform-box: fill-box;
      transition: transform 28s cubic-bezier(0.05, 0.0, 0.1, 1);
      backface-visibility: hidden;
    }

    .wave-grow.upward {
      bottom: 0;
      transform-origin: 50% 100%;
    }

    .wave-grow.downward {
      top: 0;
      transform-origin: 50% 0%;
    }

    .wave svg {
      width: 100%;
      height: 100%;
      overflow: visible;
      display: block;
    }

    
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="waves" id="waves"></div>

    <div class="icon-stack" id="iconStack">
      <div class="icon" id="iconA"></div>
      <div class="icon" id="iconB"></div>
    </div>
  </div>

  <script>
    const wavesLayer = document.getElementById('waves');
    const iconA = document.getElementById('iconA');
    const iconB = document.getElementById('iconB');
    const iconStack = document.getElementById('iconStack');

    const iconPaths = {
      A: 'm 39.390804,32.038017 0.0721,-10.120307 -3.5117,-0.01 -3.5117,-0.01 1.45521,-0.7007 c 7.08808,-3.41302 7.27073,-14.6473932 0.30724,-18.1760632 -2.16711,-1.09816 -4.163378,-1.2681927 -15.021382,-1.245621 l -8.469795,0.017607 C 4.0969785,2.2135623 1.2663497,7.8454194 1.5497668,12.762799 c 2.2928267,0.08819 4.5198605,-0.06211 6.8126872,0.0261 l -1.27415,0.49155 c -1.57524,0.60769 -3.83763,2.77682 -4.64227,4.4509 -0.87231,1.81486 -1.12093,9.314617 -1.03733,14.504427',
      B: 'm 28.420814,0.88874496 -11.81737,-0.0325 c 0,0 -1.54292,-0.003 -3.26525,-0.003 -3.6263795,0 -5.8306595,0.53910004 -7.6790095,1.87804004 -3.64711,2.64195 -4.0070748,5.0635294 -4.19258,14.00041 -0.1081226,5.208906 0.4319958,5.988867 0.93192,7.18573 0.4025803,0.963813 2.6189267,4.75978 5.5273567,5.36353 0.8587,0.17826 6.3758748,0.208219 13.3614628,0.20038 l 9.376839,-0.01052 c 0.283848,-0.03816 1.570383,-0.117122 2.050502,-0.295474 6.54391,-1.737758 7.148978,-14.636724 1.245729,-17.810262 l -1.45165,-0.70179 3.52899,-0.01 3.52898,-0.01 -0.17404,-1.12448 c -0.28195,-1.82166 -0.68559,-2.89459 -1.6175,-4.29948 -1.09774,-1.65491 -2.30445,-2.82961 -4.36292,-3.6884 -1.12503,-0.46935 -1.55481,-0.52062 -3.36983,-0.59925004 -0.44621,-0.0193 -0.97665,-0.0261 -1.62163,-0.043'
    };

    let waveZCounter = 1;

    function randomColor() {
      const hue = Math.floor(Math.random() * 360);
      const sat = 72 + Math.floor(Math.random() * 24);
      const light = 46 + Math.floor(Math.random() * 18);
      return `hsl(${hue}, ${sat}%, ${light}%)`;
    }

    function getAnchorPoint(el, side) {
      const rect = el.getBoundingClientRect();
      return {
        x: rect.left + rect.width / 2,
        y: side === 'bottom' ? rect.bottom : rect.top
      };
    }

    function createMeasuredSvg(pathData, color) {
      const svgNS = 'http://www.w3.org/2000/svg';
      const tempSvg = document.createElementNS(svgNS, 'svg');
      const tempPath = document.createElementNS(svgNS, 'path');
      tempPath.setAttribute('d', pathData);
      tempSvg.appendChild(tempPath);
      tempSvg.style.position = 'absolute';
      tempSvg.style.visibility = 'hidden';
      tempSvg.style.pointerEvents = 'none';
      wavesLayer.appendChild(tempSvg);

      const box = tempPath.getBBox();
      tempSvg.remove();

      const svg = document.createElementNS(svgNS, 'svg');
      svg.setAttribute('viewBox', `0 0 ${box.width} ${box.height}`);
      svg.setAttribute('aria-hidden', 'true');
      svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');

      const path = document.createElementNS(svgNS, 'path');
      path.setAttribute('d', pathData);
      path.setAttribute('fill', color);
      path.setAttribute('transform', `translate(${-box.x} ${-box.y})`);

      svg.appendChild(path);

      return {
        svg,
        width: box.width,
        height: box.height,
        bbox: box
      };
    }

    function renderStaticIcon(container, pathData, sizePx) {
      const measured = createMeasuredSvg(pathData, 'rgba(255,255,255,0.96)');
      const aspect = measured.width / measured.height;
      const widthPx = sizePx * aspect;

      container.innerHTML = '';
      container.style.width = `${widthPx}px`;
      container.style.height = `${sizePx}px`;
      container.appendChild(measured.svg);

      const logo = document.createElement('img');
      logo.className = 'center-logo';
      logo.src = container.id === 'iconA' ? 'logoHTML.png' : 'logoCSS.png';
      logo.alt = container.id === 'iconA' ? 'Logo HTML' : 'Logo CSS';
      container.appendChild(logo);

      return {
        width: widthPx,
        height: sizePx,
        bbox: measured.bbox
      };
    }

    function layoutIcons() {
      const iconSize = Math.min(window.innerHeight * 0.15, 350);
      const a = renderStaticIcon(iconA, iconPaths.A, iconSize);
      const b = renderStaticIcon(iconB, iconPaths.B, iconSize);
      const gap = iconSize * 0.05;
      const totalHeight = a.height + gap + b.height;
      const stackHeight = window.innerHeight;
      const startTop = (stackHeight - totalHeight) / 2;

      iconA.style.top = `${startTop}px`;
      iconB.style.top = `${startTop + a.height + gap}px`;
    }

    function positionWaveAtOrigin(wave) {
      const targetEl = wave.dataset.origin === 'A' ? iconA : iconB;
      const direction = wave.dataset.direction;
      const anchorSide = direction === 'upward' ? 'bottom' : 'top';
      const { x, y } = getAnchorPoint(targetEl, anchorSide);
      const targetRect = targetEl.getBoundingClientRect();
      const width = targetRect.width;
      const height = targetRect.height;
      const initialTop = direction === 'upward' ? y - height : y;

      wave.style.width = `${width}px`;
      wave.style.height = `${height}px`;
      wave.style.left = `${x - width / 2}px`;
      wave.style.top = `${initialTop}px`;
    }

    function createWave(targetEl, pathData, color, direction, baseScale = 1, origin = 'A') {
      const measured = createMeasuredSvg(pathData, color);

      const wave = document.createElement('div');
      wave.className = `wave ${direction}`;
      wave.dataset.origin = origin;
      wave.dataset.direction = direction;
      wave.style.zIndex = String(waveZCounter++);
      positionWaveAtOrigin(wave);

      const grow = document.createElement('div');
      grow.className = `wave-grow ${direction}`;
      grow.style.transform = `scale(${baseScale})`;
      grow.style.transformOrigin = direction === 'upward' ? '50% 100%' : '50% 0%';

      grow.appendChild(measured.svg);
      wave.appendChild(grow);
      wavesLayer.appendChild(wave);

      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          grow.style.transform = `scale(${baseScale * 12})`;
        });
      });

      

      setTimeout(() => {
        wave.remove();
      }, 6100);
    }

    function emitBurst() {
      const burstColor = randomColor();
      createWave(iconA, iconPaths.A, burstColor, 'upward', 1, 'A');
      setTimeout(() => {
        createWave(iconB, iconPaths.B, burstColor, 'downward', 1, 'B');
      }, 120);
    }

    layoutIcons();

    emitBurst();
    setInterval(emitBurst, 700);

    window.addEventListener('resize', () => {
      layoutIcons();

      document.querySelectorAll('.wave').forEach((wave) => {
        positionWaveAtOrigin(wave);
      });
    });
  </script>
</body>
</html>
